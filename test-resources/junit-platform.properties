# En un proyecto Java con JUnit 5, junit-platform.properties 
# debe estar en el classpath de tests, 
# normalmente dentro de una carpeta de recursos de test.

# Comentar/descomentar para desactivar/activar el timeout solo en modo debug
junit.jupiter.execution.timeout.mode=disabled_on_debug

# Fijar tiempo máximo de timeout para cada test
junit.jupiter.execution.timeout.default=2 s

# Ejecutar los tests en hilos separados para evitar bloqueos en el hilo principal
# cuando se aplicant timeouts en depuración.
junit.jupiter.execution.timeout.thread.mode.default=separate_thread
